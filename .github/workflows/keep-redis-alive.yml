name: Keep Upstash Redis Alive

on:
  schedule:
    # Runs every 5 days at 6:00 AM UTC — well under Upstash's "few weeks" inactivity window
    - cron: '0 6 */5 * *'
  workflow_dispatch: {}   # lets you trigger it manually anytime from the Actions tab

jobs:
  ping-redis:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Upstash Redis (SET + GET keepalive key)
        run: |
          curl -s -X POST "${{ secrets.UPSTASH_REDIS_REST_URL }}/set/keepalive/$(date +%s)" \
            -H "Authorization: Bearer ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}"
          echo ""
          curl -s "${{ secrets.UPSTASH_REDIS_REST_URL }}/get/keepalive" \
            -H "Authorization: Bearer ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}"
